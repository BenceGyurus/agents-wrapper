name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Unit Tests (Debian / Linux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Unit Tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v

  build-package:
    name: Build Python Package & Docker (Debian)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Python Distribution (Wheel & Source)
        run: |
          python -m build

      - name: Verify Package Installation
        run: |
          pip install dist/*.whl
          agents-wrapper --help

      - name: Build Docker Container (Debian Bookworm)
        run: |
          docker build -t agents-wrapper:latest .

      - name: Test Docker Container Run
        run: |
          docker run -d -p 11434:11434 --name test-wrapper agents-wrapper:latest
          sleep 3
          docker logs test-wrapper
          curl -f http://localhost:11434/api/version || (docker logs test-wrapper && exit 1)
          docker stop test-wrapper

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*
          retention-days: 7
