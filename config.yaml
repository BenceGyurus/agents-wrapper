server:
  host: "0.0.0.0"
  port: 11434  # Default Ollama port so Open WebUI connects seamlessly
  log_level: "info"

backends:
  agy:
    binary_path: "agy"
    default_model: "gemini-3.8-flash-high"
    default_effort: ""  # Empty: allows agy to use model's built-in effort (-low, -medium, -high)
    auto_discover_models: true
    timeout_seconds: 120

  codex:
    binary_path: "codex"
    default_sandbox: "read-only"
    timeout_seconds: 120

queue:
  enabled: true
  max_workers: 2               # Maximum concurrent CLI agents executing simultaneously
  max_queue_size: 50           # Maximum waiting requests in queue before rejecting with 429
  job_timeout_seconds: 120     # Timeout in seconds for model execution (auto-terminates if hung)
  queue_wait_timeout_seconds: 30 # Maximum time a request waits in queue for a free worker

pipeline:
  layers:
    # 1. Security Check Layer
    - name: "security_check"
      enabled: true
      config:
        block_on_prompt_injection: true
        block_on_secret_leak: true
        block_on_destructive_commands: true
        custom_blocked_patterns: []

    # 2. Multimodal Image & Document Processor Layer
    - name: "multimodal_image"
      enabled: true
      config:
        media_dir: "/tmp/agents_wrapper_media"
        max_image_size_mb: 25
        max_images_per_request: 10
        ttl_hours: 2
        max_storage_mb: 500

    # 3. Sanitizer & Formatter Layer
    - name: "prompt_sanitizer"
      enabled: true
      config:
        strip_excess_whitespace: true
        include_system_prompt_prefix: true

    # 3. Audit Logging Layer
    - name: "audit_logger"
      enabled: true
      config:
        log_to_console: true
        log_file: "audit.log"

    # 4. Optional External Hook (for external RAG services or webhooks)
    - name: "external_hook"
      enabled: false
      config:
        webhook_url: ""
        timeout_seconds: 5

# Explicit custom profiles (dynamic models like agy:* and codex:* work out of the box too)
profiles:
  "agy-secure":
    backend: "agy"
    model: "gemini-3.8-flash-high"
    description: "Antigravity CLI with full security checks and code review mode"
    pipeline_overrides:
      security_check:
        block_on_prompt_injection: true
        block_on_destructive_commands: true

  "agy-plan":
    backend: "agy"
    model: "gemini-3.8-flash-high"
    mode: "plan"
    description: "Antigravity CLI in planning mode"

  "codex-readonly":
    backend: "codex"
    sandbox: "read-only"
    description: "OpenAI Codex CLI in sandboxed read-only mode"
