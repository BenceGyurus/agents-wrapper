[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agents-wrapper"
version = "0.1.0"
description = "Ollama-compatible API wrapper for Google Antigravity and OpenAI Codex CLIs with pluggable security & RAG layers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Bence Gyurus"}
]
keywords = ["ollama", "antigravity", "codex", "llm", "wrapper", "open-webui", "security", "agent"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "build>=1.0.0",
]

[project.scripts]
agents-wrapper = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
